<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIST - MISP Event Creator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 0;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 1200px;
        }
        
        h3 {
            color: #667eea;
            font-weight: bold;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .section-title {
            color: #495057;
            font-weight: 600;
            font-size: 1.2rem;
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            border-radius: 15px;
            padding: 15px 50px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .btn-secondary {
            border-radius: 10px;
        }
        
        .form-control, .form-select {
            border-radius: 10px;
            border: 2px solid #e9ecef;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .table {
            margin-top: 20px;
        }
        
        .table th {
            background: #667eea;
            color: white;
        }
        
        .btn-sm {
            padding: 4px 12px;
            font-size: 0.875rem;
        }
        
        .tag-badge, .galaxy-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            margin: 5px;
            font-size: 0.9rem;
        }
        
        .badge-remove {
            cursor: pointer;
            margin-left: 8px;
            font-weight: bold;
        }
        
        .badge-remove:hover {
            color: #ff6b6b;
        }
        
        #selectedTags, #selectedGalaxies {
            min-height: 60px;
            border: 2px dashed #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
        }

        /* Nested dropdown styling - CRITICAL */
        .dropend {
            position: relative;
        }
        
        .dropend .dropdown-menu {
            position: absolute;
            left: 100%;
            top: 0;
            margin-left: 0.125rem;
            display: none;
        }

        .dropend .dropdown-menu.show {
            display: block !important;
        }

        .dropdown-item.dropdown-toggle::after {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%) rotate(-90deg);
        }

        .dropdown-item.dropdown-toggle {
            position: relative;
            padding-right: 30px;
        }

        .dropdown-item.dropdown-toggle:hover {
            background-color: #e9ecef;
        }

        .dropdown-menu {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="row">
            <div class="col-12">
                <h3>🛡️ MIST - MISP Event Creator</h3>
            </div>
        </div>

        <!-- Event Metadata Section -->
        <div class="section-title">📋 Event Metadata</div>
        
        <div class="row g-3">
            <!-- Date -->
            <div class="col-md-3">
                <label class="form-label">Date</label>
                <input type="date" class="form-control" id="eventDate" />
            </div>
            
            <!-- Distribution -->
            <div class="col-md-3">
                <label class="form-label">Distribution</label>
                <select class="form-select" id="distribution">
                    <option value="0">Your organisation only (0)</option>
                    <option value="1">This community only (1)</option>
                    <option value="2" selected>Connected communities (2)</option>
                    <option value="3">All communities (3)</option>
                    <option value="4">Sharing group (4)</option>
                </select>
            </div>
            
            <!-- Threat Level -->
            <div class="col-md-3">
                <label class="form-label">Threat Level</label>
                <select class="form-select" id="threatLevel">
                    <option value="1">High (1)</option>
                    <option value="2" selected>Medium (2)</option>
                    <option value="3">Low (3)</option>
                    <option value="4">Undefined (4)</option>
                </select>
            </div>
            
            <!-- Analysis -->
            <div class="col-md-3">
                <label class="form-label">Analysis</label>
                <select class="form-select" id="analysis">
                    <option value="0">Initial (0)</option>
                    <option value="1" selected>Ongoing (1)</option>
                    <option value="2">Completed (2)</option>
                </select>
            </div>
        </div>

        <!-- Event Info -->
        <div class="row mt-3">
            <div class="col-12">
                <label class="form-label">Event Info</label>
                <input type="text" class="form-control" id="eventInfo" placeholder="Enter event description..." />
            </div>
        </div>

        <!-- Tags Section -->
        <div class="section-title">🏷️ Tags (Max 5)</div>

        <div class="row">
            <div class="col-12">
                <div id="tagsTabsContainer">
                    <!-- Tabs bus generuojami JavaScript -->
                </div>
                
                <div id="selectedTags" class="mt-3">
                    <small class="text-muted">Selected tags will appear here...</small>
                </div>
            </div>
        </div>

        <!-- Galaxies Section -->
        <div class="section-title">🌌 Galaxies (Max 7)</div>

        <div class="row">
            <div class="col-12">
                <div id="galaxiesTabsContainer">
                    <!-- Tabs bus generuojami JavaScript -->
                </div>
                
                <div id="selectedGalaxies" class="mt-3">
                    <small class="text-muted">Selected galaxies will appear here...</small>
                </div>
            </div>
        </div>

        <!-- Bulk IP Upload Section -->
        <div class="section-title">📤 Upload IPs in Bulk</div>
        
        <div class="row">
            <div class="col-12">
                <label class="form-label">IP Addresses (one per line)</label>
                <textarea class="form-control" id="bulkIPs" rows="5" placeholder="192.168.1.1&#10;10.0.0.1&#10;172.16.0.1"></textarea>
                <button type="button" class="btn btn-primary mt-2" id="uploadIPsBtn">📤 Upload IPs to Table</button>
            </div>
        </div>

        <!-- Attributes Table Section -->
        <div class="section-title">📊 Attributes Table</div>
        
        <div class="row">
            <div class="col-12">
                <button type="button" class="btn btn-secondary btn-sm mb-2" id="addRowBtn">+ Add Row Manually</button>
                
                <div class="table-responsive">
                    <table class="table table-bordered table-hover" id="attributesTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Category</th>
                                <th>Type</th>
                                <th>Value</th>
                                <th>First Seen</th>
                                <th>Last Seen</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Rows will be added here dynamically -->
                            <tr>
                                <td colspan="7" class="text-center text-muted">No attributes yet. Add IPs or create manually.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Submit Button -->
        <div class="row mt-4">
            <div class="col-12 text-center">
                <button type="button" class="btn btn-success" id="submitBtn">
                    ✨ Create MISP Event
                </button>
            </div>
        </div>

        <!-- Result -->
        <div id="result" class="mt-4"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
