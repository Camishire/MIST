<!doctype html>
<html lang="lt">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIST Creator | Dynamic Interface</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="page-wrapper">
    <div class="header-area d-flex justify-content-between align-items-end">
        <div>
            <h1 class="fw-800 m-0" style="letter-spacing: -2px; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">MIST.creator</h1>
        </div>
    </div>

    <div class="section-panel meta-area">
        <div class="section-title">01 / Event Metadata</div>
        <div class="row g-3">
            <div class="col-md-4">
                <label class="small fw-600 mb-1 opacity-50">DATE</label>
                <input type="date" class="form-control" id="eventDate">
            </div>
            <div class="col-md-4">
                <label class="small fw-600 mb-1 opacity-50">DISTRIBUTION</label>
                <div id="distributionDropdownRoot"></div>
            </div>
            <div class="col-md-4">
                <label class="small fw-600 mb-1 opacity-50">THREAT LEVEL</label>
                <div id="threatLevelDropdownRoot"></div>
            </div>
            <div class="col-md-6">
                <label class="small fw-600 mb-1 opacity-50">ANALYSIS STATUS</label>
                <div id="analysisDropdownRoot"></div>
            </div>
            <div class="col-md-6">
                <label class="small fw-600 mb-1 opacity-50">EVENT INFO / DESCRIPTION</label>
                <input type="text" class="form-control" id="eventInfo" placeholder="Trumpas aprašymas...">
            </div>
        </div>
    </div>

    <div class="section-panel tags-area">
        <div class="section-title">02 / Tags</div>
        <div id="tagsDropdownRoot"></div>
        <div id="selectedTags" class="badge-container mt-3">
            <small class="text-muted w-100 text-center">Pasirinkite Tags</small>
        </div>
    </div>

    <div class="section-panel bulk-area">
        <div class="section-title">03 / Bulk IP Upload</div>
        <textarea class="form-control" id="bulkGrabberTextarea" rows="5" placeholder="Surašykite IP adresus po vieną eilutėje..."></textarea>
        <div class="d-flex justify-content-between align-items-center mt-3">
            <button class="btn btn-dark btn-sm px-4" style="border-radius: 10px;" id="BulkUploadbtn">Import to Table</button>
        </div>
    </div>

    <div class="section-panel galaxy-area">
        <div class="section-title">04 / Galaxies</div>
        <div id="galaxyDropdownRoot"></div>
        <div id="selectedGalaxies" class="badge-container mt-3">
            <small class="text-muted w-100 text-center">Pasirinkite Galaxies</small>
        </div>
    </div>

    <div class="section-panel table-area">
        <div class="section-title">05 / Event Attributes</div>
        <div class="table-responsive">
            <table class="table align-middle m-0" id="ObjectsTable">
                <thead>
                    <tr>
                        <th class="small" id="DateColumn">Date</th>
                        <th class="small" id="CategoryColumn">Category</th>
                        <th class="small" id="TypeColumn">Type</th>
                        <th class="small" id="ValueColumn">Value</th>
                        <th class="small" id="CommentColumn">
                            Comment
                            <button class="btn btn-sm btn-outline-secondary ms-2"
                                id="AbuseIPDBBulk"
                                style="border-radius: 8px; font-size: 0.75rem; padding: 2px 8px;"
                                title="Enrich all IP attributes with AbuseIPDB data">
                                ⭐
                            </button>
                        </th>
                        <th class="small text-end" id="ActionColumn">Action</th>                        
                    </tr>
                </thead>
                <tbody id="attrTableBody">
                    <tr>
                        <td colspan="6" class="text-center py-5 text-muted small">Lentelė tuščia. Pridėkite atributų.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="col-12 text-center py-5">
        <button class="btn btn-create" id="submitBtn">✨ CREATE MISP EVENT</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Config FIRST (prieš visus kitus) -->
<script src="/static/scripts/config.js"></script>

<!-- Kiti failai tvarka: -->
<script src="/static/scripts/APIgetter.js"></script>
<script src="/static/scripts/APIposter.js"></script>
<script src="/static/scripts/Dropdowns.js"></script>
<script src="/static/scripts/BadgeManager.js"></script>
<script src="/static/scripts/BulkGrabber.js"></script>
<script src="/static/scripts/BulkAbuseHandler.js"></script>
<script src="/static/scripts/EventSubmit.js"></script>
<script src="/static/scripts/setup.js"></script>

<!-- Set default date -->
<script>
    document.getElementById('eventDate').valueAsDate = new Date();
</script>

</body>
</html>
